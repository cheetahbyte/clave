server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

	server_tokens off;
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_comp_level 6;
	gzip_types text/css application/javascript application/json image/svg+xml;

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        return 404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
