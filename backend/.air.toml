root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Change this to your entry point:
  cmd = "go build -o ./tmp/main ./cmd/clave"
  bin = "./tmp/main"
  full_bin = "APP_ENV=dev ./tmp/main"
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "toml"]
  exclude_dir = ["assets", "tmp", "vendor", "frontend"]
  delay = 1000
